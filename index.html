<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Wizard - AI Resume & Cover Letter Generator</title>
    <style>
        :root { --primary: #2563eb; --primary-hover: #1d4ed8; --bg: #f8fafc; --text: #0f172a; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background-color: var(--bg); color: var(--text); padding: 40px 20px; margin: 0; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        
        .lang-bar { text-align: right; margin-bottom: 20px; }
        .lang-bar select { padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; background: white; cursor: pointer; }

        .hero { text-align: center; margin-bottom: 30px; padding-bottom: 25px; border-bottom: 2px solid #e2e8f0; }
        .hero h1 { color: var(--primary); font-size: 30px; margin-bottom: 10px; }
        .hero p { font-size: 16px; color: #475569; margin-bottom: 20px; line-height: 1.5; }
        .hero-img { width: 100%; max-height: 280px; object-fit: cover; border-radius: 10px; margin-bottom: 20px; }
        .start-btn { display: inline-block; width: auto; padding: 12px 28px; font-size: 16px; border: none; border-radius: 8px; background-color: var(--primary); color: white; font-weight: 600; cursor: pointer; }
        .start-btn:hover { background-color: var(--primary-hover); }

        label { display: block; font-weight: 600; margin-bottom: 8px; margin-top: 15px; }
        .radio-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; background: #f1f5f9; padding: 15px; border-radius: 8px; }
        .radio-option { display: flex; align-items: center; gap: 10px; font-weight: normal; margin: 0; cursor: pointer; }
        .radio-option input { cursor: pointer; }
        textarea { width: 100%; height: 120px; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; resize: none; box-sizing: border-box; margin-bottom: 10px; font-size: 14px; }
        button.submit-btn { width: 100%; background-color: var(--primary); color: white; border: none; padding: 14px; font-size: 16px; font-weight: 600; border-radius: 8px; cursor: pointer; margin-top: 10px; }
        button.submit-btn:hover { background-color: var(--primary-hover); }
        
        .loading { display: none; text-align: center; font-weight: 600; color: var(--primary); margin: 20px 0; }
        .result-box { display: none; margin-top: 20px; border-top: 2px solid #e2e8f0; padding-top: 20px; }
        .output { background: #f1f5f9; padding: 15px; border-radius: 8px; white-space: pre-wrap; border: 1px solid #e2e8f0; font-size: 14px; line-height: 1.5; }
    </style>
</head>
<body>

<div class="container">
    <div class="lang-bar">
        <select id="languageSelect" onchange="changeLanguage()">
            <option value="English" selected>🌐 English</option>
            <option value="Dutch">🌐 Nederlands</option>
            <option value="French">🌐 Français</option>
            <option value="Spanish">🌐 Español</option>
            <option value="German">🌐 Deutsch</option>
            <option value="Turkish">🌐 Türkçe</option>
            <option value="Greek">🌐 Ελληνικά</option>
            <option value="Arabic">🌐 العربية</option>
            <option value="Chinese">🌐 中文</option>
            <option value="Japanese">🌐 日本語</option>
            <option value="Italian">🌐 Italiano</option>
        </select>
    </div>

    <div class="hero">
        <h1 id="heroTitle">Welcome to Resume Wizard</h1>
        <p id="heroSub">Land your dream job with AI-powered cover letters and personalized CV creation in seconds.</p>
        <img src="https://images.unsplash.com/photo-1586281380349-632531db7ed4?auto=format&fit=crop&w=800&q=80" alt="Resume Wizard Illustration" class="hero-img">
        <br>
        <button id="startBtn" class="start-btn" onclick="scrollToForm()">Start Your Application</button>
    </div>

    <div id="applicationForm">
        <label id="lblDocType">What would you like to generate?</label>
        <div class="radio-group">
            <label class="radio-option">
                <input type="radio" name="docType" value="both" checked>
                <span id="optBoth">Both Cover Letter & Tailored CV</span>
            </label>
            <label class="radio-option">
                <input type="radio" name="docType" value="letter">
                <span id="optLetter">Cover Letter Only</span>
            </label>
            <label class="radio-option">
                <input type="radio" name="docType" value="cv">
                <span id="optCv">Tailored CV / Resume Only</span>
            </label>
        </div>

        <label id="lblCv" for="cvInput">Paste your current Resume or Details:</label>
        <textarea id="cvInput" placeholder="Work experience, education, skills..."></textarea>
        
        <label id="lblJob" for="jobInput">Paste the job description:</label>
        <textarea id="jobInput" placeholder="Paste the full text of the job you want to apply for..."></textarea>
        
        <button id="submitBtn" class="submit-btn" onclick="matchCV()">Generate Document(s)</button>
        
        <div id="loading" class="loading">AI is analyzing and writing... Please wait.</div>
        
        <div id="resultBox" class="result-box">
            <h2 id="resultTitle">Your AI Generated Content</h2>
            <div id="aiOutput" class="output"></div>
        </div>
    </div>
</div>

<script>
    const translations = {
        English: {
            title: "Welcome to Resume Wizard",
            sub: "Land your dream job with AI-powered cover letters and personalized CV creation in seconds.",
            startBtn: "Start Your Application",
            lblDocType: "What would you like to generate?",
            optBoth: "Both Cover Letter & Tailored CV",
            optLetter: "Cover Letter Only",
            optCv: "Tailored CV / Resume Only",
            lblCv: "Paste your current Resume or Details:",
            phCv: "Work experience, education, skills...",
            lblJob: "Paste the job description:",
            phJob: "Paste the full text of the job you want to apply for...",
            submitBtn: "Generate Document(s)",
            loading: "AI is analyzing and writing... Please wait.",
            resultTitle: "Your AI Generated Content",
            alertFill: "Please fill in both fields."
        },
        Dutch: {
            title: "Welkom bij Resume Wizard",
            sub: "Scoor jouw droombaan met AI-gegenereerde sollicitatiebrieven en aangepaste CV's binnen enkele seconden.",
            startBtn: "Start Jouw Sollicitatie",
            lblDocType: "Wat wil je laten maken?",
            optBoth: "Zowel Sollicitatiebrief als CV",
            optLetter: "Alleen Sollicitatiebrief",
            optCv: "Alleen Aangepast CV / Resume",
            lblCv: "Plak je huidige CV of Gegevens:",
            phCv: "Werkervaring, opleidingen, vaardigheden...",
            lblJob: "Plak de vacaturetekst:",
            phJob: "Plak de volledige tekst van de vacature...",
            submitBtn: "Genereer Documenten",
            loading: "AI is aan het analyseren en schrijven... Een moment geduld.",
            resultTitle: "Jouw Gegenereerde Inhoud",
            alertFill: "Vul alstublieft zowel je gegevens als de vacature in."
        },
        French: {
            title: "Bienvenue sur Resume Wizard",
            sub: "Décrochez le job de vos rêves grâce à des lettres de motivation et CV personnalisés générés par l'IA.",
            startBtn: "Commencer ma candidature",
            lblDocType: "Que souhaitez-vous générer ?",
            optBoth: "Lettre de motivation & CV sur mesure",
            optLetter: "Lettre de motivation uniquement",
            optCv: "CV sur mesure uniquement",
            lblCv: "Collez votre CV actuel ou vos infos :",
            phCv: "Expérience professionnelle, formation, compétences...",
            lblJob: "Collez l'offre d'emploi :",
            phJob: "Collez le texte complet de l'annonce...",
            submitBtn: "Générer les documents",
            loading: "L'IA analyse et rédige... Veuillez patienter.",
            resultTitle: "Votre contenu généré par l'IA",
            alertFill: "Veuillez remplir les deux champs."
        },
        Spanish: {
            title: "Bienvenido a Resume Wizard",
            sub: "Consigue el trabajo de tus sueños con cartas de presentación y CVs personalizados optimizados por IA.",
            startBtn: "Iniciar mi solicitud",
            lblDocType: "¿Qué deseas generar?",
            optBoth: "Ambos: Carta de Presentación y CV",
            optLetter: "Solo Carta de Presentación",
            optCv: "Solo CV Personalizado",
            lblCv: "Pega tu CV actual o datos:",
            phCv: "Experiencia laboral, educación, habilidades...",
            lblJob: "Pega la oferta de trabajo:",
            phJob: "Pega el texto completo de la oferta...",
            submitBtn: "Generar Documento(s)",
            loading: "La IA está analizando y escribiendo... Por favor espera.",
            resultTitle: "Tu Contenido Generado por IA",
            alertFill: "Por favor, rellena ambos campos."
        }
    };

    function changeLanguage() {
        const lang = document.getElementById('languageSelect').value;
        const t = translations[lang] || translations.English;

        document.getElementById('heroTitle').innerText = t.title;
        document.getElementById('heroSub').innerText = t.sub;
        document.getElementById('startBtn').innerText = t.startBtn;
        document.getElementById('lblDocType').innerText = t.lblDocType;
        document.getElementById('optBoth').innerText = t.optBoth;
        document.getElementById('optLetter').innerText = t.optLetter;
        document.getElementById('optCv').innerText = t.optCv;
        document.getElementById('lblCv').innerText = t.lblCv;
        document.getElementById('cvInput').placeholder = t.phCv;
        document.getElementById('lblJob').innerText = t.lblJob;
        document.getElementById('jobInput').placeholder = t.phJob;
        document.getElementById('submitBtn').innerText = t.submitBtn;
        document.getElementById('loading').innerText = t.loading;
        document.getElementById('resultTitle').innerText = t.resultTitle;
    }

    function scrollToForm() {
        document.getElementById('applicationForm').scrollIntoView({ behavior: 'smooth' });
    }

    async function matchCV() {
        const cv = document.getElementById('cvInput').value;
        const job = document.getElementById('jobInput').value;
        const language = document.getElementById('languageSelect').value;
        const documentType = document.querySelector('input[name="docType"]:checked').value;
        const t = translations[language] || translations.English;

        if (!cv || !job) { 
            alert(t.alertFill); 
            return; 
        }

        document.getElementById('loading').style.display = 'block';
        document.getElementById('resultBox').style.display = 'none';

        try {
            const response = await fetch('/api/openai-match', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ cv, job, language, documentType })
            });

            const data = await response.json();

            if(data.error) {
                alert('Error: ' + data.error);
                document.getElementById('loading').style.display = 'none';
                return;
            }

            document.getElementById('loading').style.display = 'none';
            document.getElementById('resultBox').style.display = 'block';
            document.getElementById('aiOutput').innerText = data.text;

        } catch (error) {
            alert('Connection error.');
            document.getElementById('loading').style.display = 'none';
        }
    }
</script>
</body>
</html>
